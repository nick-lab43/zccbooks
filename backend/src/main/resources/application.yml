spring:
  application:
    name: zccbooks-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zccbooks}
    username: ${DB_USERNAME:zccbooks}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:${SERVER_PORT:8080}}
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:Central Administrator}
